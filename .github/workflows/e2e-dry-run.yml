name: E2E dry-run

# Read-only adoption gate. Builds the CLI, then runs `streamctl init
# --no-install`, `check` and `sync --dry-run` against the synthetic
# `@acme/payload` fixture on every package manager. Nothing is written to the
# scratch repo's tracked tree, so this checks that the read-only commands behave
# the same way everywhere before anyone adopts for real.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One in-flight run per workflow+ref: a new push/PR-update cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-dry-run:
    name: e2e (E2E_PM=${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every PM runs the full synthetic-payload gate (init + read-only + payload
        # extension); detection + install-command naming differ per PM.
        pm: [pnpm, npm, yarn, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/e2e-dry-run.mjs
        env:
          E2E_PM: ${{ matrix.pm }}
