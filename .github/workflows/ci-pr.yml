name: PR CI

# Typecheck, test and self-lint on every PR and on push to main.
#
# The CLI targets Node ^22.22.2 || ^24.15.0 || >=26. The matrix pins the LTS
# floor (22) and current (24); both resolve above the floor. The Windows leg
# guards path handling in the test helpers.
#
# See e2e-dry-run.yml for the read-only adoption gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One in-flight run per workflow+ref: a new push/PR-update cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the repo's `packageManager` pin (pnpm@10.29.x).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Repo self-lint via the root eslint.config.ts + `lint` script.
      - name: Lint
        run: pnpm lint

  # Windows covers the test helpers (tmp dirs, path joins). Tests only, since
  # typecheck and lint are OS-independent and already covered above.
  windows-tests:
    name: tests (windows, node 24)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  # Guard the published artifact's shape on every PR, not just at release time.
  # publint checks package.json (exports / files / bin resolve to real tarball
  # entries); attw checks type resolution for consumers. `--profile esm-only`
  # acknowledges this is an intentionally ESM-only package (the CJS/node10
  # "failures" are expected, not real). Mirrors the gate in release.yml.
  package:
    name: package (ubuntu, node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint the package (publint)
        run: pnpm exec publint
      - name: Check type resolution (are-the-types-wrong)
        run: pnpm exec attw --pack . --profile esm-only
