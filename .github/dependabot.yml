# Dependabot config: keeps the SHA-pinned GitHub Actions fresh and the
# npm deps current. Dependabot understands the `uses:` SHA pins + version
# comments and PRs the next SHA with an updated comment.
version: 2
updates:
  # SHA-pinned actions in .github/workflows rot silently without this.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm entry included: this is a small single-package repo, so grouping every
  # update into one weekly PR keeps the noise low while deps stay current.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before PRing it, so pulled/broken versions
    # never land here.
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # TS 7.0 shipped without a JS compiler API (due in 7.1), so typescript-eslint
    # and rollup-plugin-dts (via unbuild) both fail on it. Since every npm update
    # is one group, the TS major would block the rest. Drop this once both support it.
    # https://github.com/typescript-eslint/typescript-eslint/issues/12518
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
